<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essays · Speedrun OS</title>
    <link rel="stylesheet" href="assets/style.css?v=202610240018">
    <script src="assets/app.js?v=202610240018"></script>
    <style>
        .sortbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
        .sortbar .label { margin-right: 4px; }
        .sort-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
        .essays { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        .essay { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; }
        .essay:last-child { border-bottom: none; }
        .essay:hover { background: var(--surface-2); color: var(--text); }
        .essay__icon { font-size: 1.4rem; }
        .essay__main { flex: 1; min-width: 0; }
        .essay__title { font-weight: 650; }
        .essay__date { font-size: 0.86rem; color: var(--text-3); }
        @media (max-width: 520px) { .essay { flex-wrap: wrap; } .essay .badge { margin-left: 40px; } }
    </style>
</head>
<body>

<main class="page page--narrow" id="main">
    <div class="page-head">
        <h1>Essay Archive</h1>
        <p class="lede">Every graded text, with its error breakdown and rewrite. New essays: copy <a href="essay-template.html">the template</a>, fill it with the AI, add a line to the list in this file.</p>
    </div>

    <div class="sortbar" role="group" aria-label="Sort essays">
        <span class="label">Sort by</span>
        <button class="btn btn--sm sort-btn" type="button" data-col="date">Date</button>
        <button class="btn btn--sm sort-btn" type="button" data-col="name">Name</button>
        <button class="btn btn--sm sort-btn" type="button" data-col="grade">Grade</button>
    </div>

    <div class="essays" id="row-view"></div>
</main>

<script>
    // THE DIRECTORY INDEX · add one entry per essay
    const db = [
        {
            title: "Skeleton: Immobilienpreise",
            date: "2026-09-16",
            grade: "Nicht bestanden (~40%)",
            passed: false,
            url: "essay-001.html"
        }
    ];

    let currentSort = { column: "date", direction: "desc" };

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function niceDate(iso) {
        const d = new Date(iso + "T12:00:00");
        return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    function renderTable() {
        const sorted = [...db].sort((a, b) => {
            let A, B;
            if (currentSort.column === "name") { A = a.title.toLowerCase(); B = b.title.toLowerCase(); }
            else if (currentSort.column === "date") { A = a.date; B = b.date; }
            else { A = parseInt((a.grade.match(/\d+/) || [0])[0], 10); B = parseInt((b.grade.match(/\d+/) || [0])[0], 10); }
            if (A < B) return currentSort.direction === "asc" ? -1 : 1;
            if (A > B) return currentSort.direction === "asc" ? 1 : -1;
            return 0;
        });

        const view = document.getElementById("row-view");
        view.innerHTML = sorted.length ? "" : '<p class="subtle" style="padding:18px;margin:0">No essays yet.</p>';
        sorted.forEach(item => {
            view.insertAdjacentHTML("beforeend",
                '<a href="' + esc(item.url) + '" class="essay">' +
                    
                    '<span class="essay__main"><span class="essay__title" lang="de">' + esc(item.title) + '</span><br><span class="essay__date">' + niceDate(item.date) + "</span></span>" +
                    '<span class="badge ' + (item.passed ? "badge--ok" : "badge--danger") + '">' + esc(item.grade) + "</span>" +
                "</a>");
        });

        document.querySelectorAll(".sort-btn").forEach(b => {
            const active = b.dataset.col === currentSort.column;
            b.setAttribute("aria-pressed", active);
            b.textContent = b.dataset.col[0].toUpperCase() + b.dataset.col.slice(1) + (active ? (currentSort.direction === "asc" ? " ↑" : " ↓") : "");
        });
    }

    document.querySelectorAll(".sort-btn").forEach(b => b.addEventListener("click", () => {
        if (currentSort.column === b.dataset.col) currentSort.direction = currentSort.direction === "asc" ? "desc" : "asc";
        else currentSort = { column: b.dataset.col, direction: b.dataset.col === "date" ? "desc" : "asc" };
        renderTable();
    }));

    renderTable();
</script>

</body>
</html>
