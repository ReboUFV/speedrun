<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Drill OS</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --primary: #00e676; 
            --nav-bg: #1a1a2e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --btn-disabled: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        
        /* Navigation Bar */
        .navbar {
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-link {
            flex: 1;
            text-align: center;
            padding: 15px 10px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .nav-link.active {
            background-color: rgba(0, 230, 118, 0.1);
            color: var(--primary);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* Text Areas */
        #english-prompt {
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 25px;
            color: var(--text-main);
        }
        #german-answer {
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.4;
            color: var(--primary);
            margin-bottom: 30px;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            min-height: 60px; /* Prevents layout jump */
        }
        .visible {
            opacity: 1 !important;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .btn {
            flex: 1;
            border: none;
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-answer {
            background-color: var(--primary);
            color: var(--bg-color);
        }
        .btn-answer:active {
            background-color: #00c853;
        }
        .btn-next {
            background-color: var(--btn-disabled);
            color: var(--text-muted);
            pointer-events: none; /* Disabled until answer is shown */
        }
        .btn-next.active {
            background-color: var(--text-main);
            color: var(--bg-color);
            pointer-events: auto;
        }
        .btn-next.active:active {
            background-color: #ddd;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html" class="nav-link">OS Menu</a>
    <a href="drill.html" class="nav-link active">Mental Drill</a>
</div>

<div class="main-wrapper">
    <div class="container">
        <div id="english-prompt">Loading...</div>
        <div id="german-answer"></div>
        
        <div class="btn-group">
            <button class="btn btn-answer" id="btn-answer" onclick="showAnswer()">Answer</button>
            <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Next</button>
        </div>
    </div>
</div>

<script>
    // The Compound Matrix: V2, Modals, Connectors (aber/und/denn), Verb-Kickers (weil/dass)
    const drillData = [
        { en: "I want to play, but I cannot, because I am tired.", de: "Ich will spielen, aber ich kann nicht, weil ich müde bin." },
        { en: "Today I am learning German, and tomorrow I will play.", de: "Heute lerne ich Deutsch, und morgen will ich spielen." },
        { en: "I must go now, but I will do it later.", de: "Ich muss jetzt gehen, aber ich will es später machen." },
        { en: "I cannot eat, because I must study.", de: "Ich kann nicht essen, weil ich lernen muss." },
        { en: "Can you tell me, that you have it?", de: "Können Sie mir sagen, dass Sie es haben?" },
        { en: "I think that it is good, but I must see it.", de: "Ich denke, dass es gut ist, aber ich muss es sehen." },
        { en: "I want it, but I cannot have it.", de: "Ich will es, aber ich kann es nicht haben." },
        { en: "He says that he is here, but I cannot see it.", de: "Er sagt, dass er hier ist, aber ich kann es nicht sehen." },
        { en: "I will wait, because I want to see it.", de: "Ich will warten, weil ich es sehen will." },
        { en: "I am eating now, because I am hungry.", de: "Ich esse jetzt, denn ich habe Hunger." },
        { en: "I must stay here, because I have no time.", de: "Ich muss hier bleiben, weil ich keine Zeit habe." },
        { en: "I know that you are here, and I want to see you.", de: "Ich weiß, dass du hier bist, und ich will dich sehen." }
    ];

    let currentIndex = 0;

    const promptEl = document.getElementById("english-prompt");
    const answerEl = document.getElementById("german-answer");
    const btnAnswer = document.getElementById("btn-answer");
    const btnNext = document.getElementById("btn-next");

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initDrill() {
        shuffle(drillData);
        loadQuestion();
    }

    function loadQuestion() {
        // Set text
        promptEl.innerText = drillData[currentIndex].en;
        answerEl.innerText = drillData[currentIndex].de;
        
        // Reset state
        answerEl.classList.remove("visible");
        
        // Button toggles
        btnAnswer.style.display = "block";
        btnNext.classList.remove("active");
    }

    function showAnswer() {
        answerEl.classList.add("visible");
        btnNext.classList.add("active");
    }

    function nextQuestion() {
        currentIndex = (currentIndex + 1) % drillData.length;
        loadQuestion();
    }

    // Start
    initDrill();
</script>

</body>
</html>
