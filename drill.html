<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Drill OS - Memory Engine</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --primary: #00e676; 
            --nav-bg: #1a1a2e;
            --error: #ff5252;
            --text-main: #ffffff;
            --text-muted: #888888;
            --btn-disabled: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        
        /* Navigation Bar */
        .navbar {
            width: 100%;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-link {
            flex: 1;
            text-align: center;
            padding: 15px 10px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .nav-link.active {
            background-color: rgba(0, 230, 118, 0.1);
            color: var(--primary);
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* Text Areas */
        #english-prompt {
            font-size: 1.25rem;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--text-main);
        }
        #german-answer {
            font-size: 1.35rem;
            font-weight: bold;
            line-height: 1.5;
            color: var(--primary);
            margin-bottom: 30px;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            min-height: 80px; 
        }
        .visible {
            opacity: 1 !important;
        }

        /* Syntax Tags */
        .tag {
            background-color: #333;
            color: #ffb142;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            text-transform: uppercase;
            vertical-align: middle;
        }

        /* Buttons */
        .btn-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .btn-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .btn {
            flex: 1;
            border: none;
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-answer {
            background-color: var(--primary);
            color: var(--bg-color);
        }
        .btn-answer:active {
            background-color: #00c853;
        }
        .btn-next, .btn-danger {
            background-color: var(--btn-disabled);
            color: var(--text-muted);
            pointer-events: none;
        }
        .btn-next.active {
            background-color: var(--text-main);
            color: var(--bg-color);
            pointer-events: auto;
        }
        .btn-next.active:active {
            background-color: #ddd;
        }
        .btn-danger.active {
            background-color: transparent;
            border: 2px solid var(--error);
            color: var(--error);
            pointer-events: auto;
        }
        .btn-danger.active:active {
            background-color: rgba(255, 82, 82, 0.2);
        }
        
        #stats {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html" class="nav-link">OS Menu</a>
    <a href="drill.html" class="nav-link active">Mental Drill</a>
</div>

<div class="main-wrapper">
    <div class="container">
        <div id="english-prompt">Loading Engine...</div>
        <div id="german-answer"></div>
        
        <div class="btn-controls">
            <div class="btn-row">
                <button class="btn btn-answer" id="btn-answer" onclick="showAnswer()">Answer</button>
                <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Next</button>
            </div>
            <!-- The Danger Button -->
            <button class="btn btn-danger" id="btn-danger" onclick="banSentence()">DONE (Never Repeat)</button>
        </div>
        
        <div id="stats">Mastered Sentences: 0</div>
    </div>
</div>

<script>
    // ==========================================
    // LOCAL STORAGE MEMORY DATABASE
    // ==========================================
    // Load banned sentences from browser storage, or create empty array if new
    let bannedSentences = new Set(JSON.parse(localStorage.getItem('speedrunBannedSet')) || []);
    let currentSentenceData = { en: "", de: "" };

    function updateStats() {
        document.getElementById('stats').innerText = `Mastered Sentences: ${bannedSentences.size}`;
    }

    // ==========================================
    // STRICT SVOV PROCEDURAL ENGINE
    // ==========================================
    const subjects = [
        { de: "ich", en: "I", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"want to"} } },
        { de: "wir", en: "we", m: { can: {de:"können", en:"can"}, must: {de:"müssen", en:"must"}, want: {de:"wollen", en:"want to"} } },
        { de: "er", en: "he", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"wants to"} } },
        { de: "sie", en: "she", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"wants to"} } }
    ];

    const actions = [
        { oDe: "das Buch", oEn: "the book", vDe: "lesen", vEn: "read" },
        { oDe: "die Pizza", oEn: "the pizza", vDe: "essen", vEn: "eat" },
        { oDe: "Deutsch", oEn: "German", vDe: "lernen", vEn: "study" },
        { oDe: "das Auto", oEn: "the car", vDe: "kaufen", vEn: "buy" },
        { oDe: "das Projekt", oEn: "the project", vDe: "machen", vEn: "do" }
    ];

    const temporals = [
        { de: "heute", en: "today" }, { de: "morgen", en: "tomorrow" }, { de: "jetzt", en: "now" }
    ];

    const modals = [
        { de: "schnell", en: "quickly" }, { de: "leider", en: "unfortunately" }, { de: "gerne", en: "gladly" }
    ];

    const lokals = [
        { de: "zu Hause", en: "at home" }, { de: "in der Schule", en: "at school" }, { de: "draußen", en: "outside" }
    ];

    const pos0Connectors = [
        { de: "und", en: "and" }, { de: "aber", en: "but" }, { de: "denn", en: "because" }
    ];

    const verbKickers = [
        { de: "weil", en: "because" }, { de: "wenn", en: "if" }
    ];

    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function buildClause() {
        const s = getRandom(subjects);
        const modalKey = getRandom(["can", "must", "want"]);
        const m = s.m[modalKey];
        const a = getRandom(actions);
        const t = getRandom(temporals);
        const mod = getRandom(modals);
        const l = getRandom(lokals);

        let deMittelfeld = `${t.de} ${mod.de} ${a.oDe} ${l.de}`;
        let de = `${s.de} ${m.de} ${deMittelfeld} ${a.vDe}`;
        let en = `${s.en} ${m.en} ${a.vEn} ${a.oEn} ${mod.en} ${l.en} ${t.en}`;
        let tag = "[SVOV]";
        
        return { de, en, tag };
    }

    function buildNebensatz(connector) {
        const s = getRandom(subjects);
        const modalKey = getRandom(["can", "must", "want"]);
        const m = s.m[modalKey];
        const a = getRandom(actions);
        const t = getRandom(temporals);
        const mod = getRandom(modals);
        const l = getRandom(lokals);

        let de = `${connector.de} ${s.de} ${t.de} ${mod.de} ${a.oDe} ${l.de} ${a.vDe} ${m.de}`;
        let en = `${connector.en} ${s.en} ${m.en} ${a.vEn} ${a.oEn} ${mod.en} ${l.en} ${t.en}`;
        let tag = `[${capitalize(connector.de)}]`;

        return { de, en, tag };
    }

    function generateRawSentence() {
        const pattern = Math.floor(Math.random() * 3);
        let finalDe = "";
        let finalEn = "";

        if (pattern === 0) {
            let c1 = buildClause();
            let conn = getRandom(pos0Connectors);
            let c2 = buildClause();
            finalEn = `<span class="tag">${c1.tag}</span> ${capitalize(c1.en)}, ${conn.en} <span class="tag">${c2.tag}</span> ${c2.en}.`;
            finalDe = `${capitalize(c1.de)}, ${conn.de} ${c2.de}.`;
        } else if (pattern === 1) {
            let c1 = buildClause();
            let conn = getRandom(verbKickers);
            let c2 = buildNebensatz(conn);
            finalEn = `<span class="tag">${c1.tag}</span> ${capitalize(c1.en)}, <span class="tag">${c2.tag}</span> ${c2.en}.`;
            finalDe = `${capitalize(c1.de)}, ${c2.de}.`;
        } else {
            const intros = [
                { de: "ich denke", en: "I think" }, { de: "er sagt", en: "he says" }, { de: "wir wissen", en: "we know" }
            ];
            let intro = getRandom(intros);
            let c2 = buildNebensatz({de: "dass", en: "that"});
            finalEn = `<span class="tag">[SVOV]</span> ${capitalize(intro.en)}, <span class="tag">[Dass]</span> ${c2.en}.`;
            finalDe = `${capitalize(intro.de)}, ${c2.de}.`;
        }
        return { en: finalEn, de: finalDe };
    }

    // Generator Wrapper with LocalStorage Check
    function getUniqueSentence() {
        let sentence;
        let safeCounter = 0;
        
        do {
            sentence = generateRawSentence();
            safeCounter++;
            // Failsafe in case you somehow ban 8 million sentences
            if (safeCounter > 200) {
                console.warn("Too many rerolls, resetting memory.");
                bannedSentences.clear();
                localStorage.removeItem('speedrunBannedSet');
                updateStats();
                break;
            }
        } while (bannedSentences.has(sentence.de));
        
        return sentence;
    }

    // ==========================================
    // UI CONTROLS
    // ==========================================
    const promptEl = document.getElementById("english-prompt");
    const answerEl = document.getElementById("german-answer");
    const btnNext = document.getElementById("btn-next");
    const btnDanger = document.getElementById("btn-danger");

    function loadQuestion() {
        currentSentenceData = getUniqueSentence();
        promptEl.innerHTML = currentSentenceData.en;
        answerEl.innerText = currentSentenceData.de;
        
        // Hide answer and disable Next/Done buttons until Answer is clicked
        answerEl.classList.remove("visible");
        btnNext.classList.remove("active");
        btnDanger.classList.remove("active");
        updateStats();
    }

    function showAnswer() {
        answerEl.classList.add("visible");
        btnNext.classList.add("active");
        btnDanger.classList.add("active"); // Now you are allowed to ban it
    }

    function nextQuestion() {
        loadQuestion();
    }

    function banSentence() {
        // 1. Add current German string to the Set
        bannedSentences.add(currentSentenceData.de);
        // 2. Save it permanently to browser LocalStorage
        localStorage.setItem('speedrunBannedSet', JSON.stringify([...bannedSentences]));
        // 3. Immediately move to the next question
        loadQuestion();
    }

    // Start
    loadQuestion();
</script>

</body>
</html>
