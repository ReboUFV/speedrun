<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Drill OS - Tagless Memory Engine</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --primary: #00e676; 
            --nav-bg: #1a1a2e; --error: #ff5252; --text-main: #ffffff;
            --text-muted: #888888; --btn-disabled: #333333;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        
        .main-wrapper { max-width: 550px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        h1 { margin: 0; color: var(--primary); text-transform: uppercase; font-size: 1.5rem; text-align: center; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem; }

        /* Top Navigation Bar */
        .topbar { display: flex; gap: 6px; width: 100%; margin-bottom: 25px; }
        .topbar a { flex: 1; text-align: center; background-color: var(--card-bg); border: 1px solid var(--primary); color: var(--primary); padding: 10px 4px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.85rem; transition: all 0.2s; }
        .topbar a:hover, .topbar a.active { background-color: var(--primary); color: #000; }

        /* Drill Engine UI */
        .container { background-color: var(--card-bg); padding: 30px 20px; border-radius: 12px; border: 1px solid #333; width: 100%; box-sizing: border-box; text-align: center; min-height: 300px; display: flex; flex-direction: column; justify-content: center; margin-top: 10px; }
        
        #english-prompt { font-size: 1.25rem; font-weight: bold; line-height: 1.5; margin-bottom: 25px; color: var(--text-main); }
        #german-answer { font-size: 1.35rem; font-weight: bold; line-height: 1.5; color: var(--primary); margin-bottom: 30px; opacity: 0; transition: opacity 0.2s ease-in-out; min-height: 80px; }
        .visible { opacity: 1 !important; }

        .btn-controls { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .btn-row { display: flex; gap: 15px; width: 100%; }
        .btn { flex: 1; border: none; padding: 15px 10px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        
        .btn-answer { background-color: var(--primary); color: #000; }
        .btn-answer:active { background-color: #00c853; }
        
        .btn-next, .btn-danger { background-color: var(--btn-disabled); color: var(--text-muted); pointer-events: none; }
        .btn-next.active { background-color: var(--text-main); color: #000; pointer-events: auto; }
        .btn-next.active:active { background-color: #ddd; }
        
        .btn-danger.active { background-color: transparent; border: 2px solid var(--error); color: var(--error); pointer-events: auto; }
        .btn-danger.active:active { background-color: rgba(255, 82, 82, 0.2); }
        
        #stats { margin-top: 15px; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="main-wrapper">
    <h1>B2 Speedrun OS</h1>
    <div class="subtitle">Mental Drill Engine</div>

    <!-- OS Navigation -->
    <div class="topbar">
        <a href="index.html">🏠 OS</a>
        <a href="drill.html" class="active">⚡ Drills</a>
        <a href="archive.html">📑 Archive</a>
        <a href="performance.html">📊 Perf</a>
    </div>

    <div class="container">
        <div id="english-prompt">Loading Engine...</div>
        <div id="german-answer"></div>
        
        <div class="btn-controls">
            <div class="btn-row">
                <button class="btn btn-answer" id="btn-answer" onclick="showAnswer()">Answer</button>
                <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Next</button>
            </div>
            <button class="btn btn-danger" id="btn-danger" onclick="banSentence()">DONE (Never Repeat)</button>
        </div>
        
        <div id="stats">Mastered Sentences: 0</div>
    </div>
</div>

<script>
    // ==========================================
    // LOCAL STORAGE MEMORY DATABASE
    // ==========================================
    let bannedSentences = new Set(JSON.parse(localStorage.getItem('speedrunBannedSet')) || []);
    let currentSentenceData = { en: "", de: "" };

    function updateStats() {
        document.getElementById('stats').innerText = `Mastered Sentences: ${bannedSentences.size}`;
    }

    // ==========================================
    // STRICT SVOV PROCEDURAL ENGINE (TAGLESS)
    // ==========================================
    const subjects = [
        { de: "ich", en: "I", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"want to"} } },
        { de: "wir", en: "we", m: { can: {de:"können", en:"can"}, must: {de:"müssen", en:"must"}, want: {de:"wollen", en:"want to"} } },
        { de: "er", en: "he", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"wants to"} } },
        { de: "sie", en: "she", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"wants to"} } }
    ];

    const actions = [
        { oDe: "das Buch", oEn: "the book", vDe: "lesen", vEn: "read" },
        { oDe: "die Pizza", oEn: "the pizza", vDe: "essen", vEn: "eat" },
        { oDe: "Deutsch", oEn: "German", vDe: "lernen", vEn: "study" },
        { oDe: "das Auto", oEn: "the car", vDe: "kaufen", vEn: "buy" },
        { oDe: "das Projekt", oEn: "the project", vDe: "machen", vEn: "do" }
    ];

    const temporals = [
        { de: "heute", en: "today" }, { de: "morgen", en: "tomorrow" }, { de: "jetzt", en: "now" }
    ];

    const modals = [
        { de: "schnell", en: "quickly" }, { de: "leider", en: "unfortunately" }, { de: "gerne", en: "gladly" }
    ];

    const lokals = [
        { de: "zu Hause", en: "at home" }, { de: "in der Schule", en: "at school" }, { de: "draußen", en: "outside" }
    ];

    const pos0Connectors = [
        { de: "und", en: "and" }, { de: "aber", en: "but" }, { de: "denn", en: "because" }
    ];

    const verbKickers = [
        { de: "weil", en: "because" }, { de: "wenn", en: "if" }
    ];

    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function buildClause() {
        const s = getRandom(subjects);
        const modalKey = getRandom(["can", "must", "want"]);
        const m = s.m[modalKey];
        const a = getRandom(actions);
        const t = getRandom(temporals);
        const mod = getRandom(modals);
        const l = getRandom(lokals);

        let deMittelfeld = `${t.de} ${mod.de} ${a.oDe} ${l.de}`;
        let de = `${s.de} ${m.de} ${deMittelfeld} ${a.vDe}`;
        let en = `${s.en} ${m.en} ${a.vEn} ${a.oEn} ${mod.en} ${l.en} ${t.en}`;
        
        return { de, en };
    }

    function buildNebensatz(connector) {
        const s = getRandom(subjects);
        const modalKey = getRandom(["can", "must", "want"]);
        const m = s.m[modalKey];
        const a = getRandom(actions);
        const t = getRandom(temporals);
        const mod = getRandom(modals);
        const l = getRandom(lokals);

        let de = `${connector.de} ${s.de} ${t.de} ${mod.de} ${a.oDe} ${l.de} ${a.vDe} ${m.de}`;
        let en = `${connector.en} ${s.en} ${m.en} ${a.vEn} ${a.oEn} ${mod.en} ${l.en} ${t.en}`;

        return { de, en };
    }

    function generateRawSentence() {
        const pattern = Math.floor(Math.random() * 3);
        let finalDe = "";
        let finalEn = "";

        if (pattern === 0) {
            let c1 = buildClause();
            let conn = getRandom(pos0Connectors);
            let c2 = buildClause();
            finalEn = `${capitalize(c1.en)}, ${conn.en} ${c2.en}.`;
            finalDe = `${capitalize(c1.de)}, ${conn.de} ${c2.de}.`;
        } else if (pattern === 1) {
            let c1 = buildClause();
            let conn = getRandom(verbKickers);
            let c2 = buildNebensatz(conn);
            finalEn = `${capitalize(c1.en)}, ${c2.en}.`;
            finalDe = `${capitalize(c1.de)}, ${c2.de}.`;
        } else {
            const intros = [
                { de: "ich denke", en: "I think" }, { de: "er sagt", en: "he says" }, { de: "wir wissen", en: "we know" }
            ];
            let intro = getRandom(intros);
            let c2 = buildNebensatz({de: "dass", en: "that"});
            finalEn = `${capitalize(intro.en)}, ${c2.en}.`;
            finalDe = `${capitalize(intro.de)}, ${c2.de}.`;
        }
        return { en: finalEn, de: finalDe };
    }

    function getUniqueSentence() {
        let sentence;
        let safeCounter = 0;
        
        do {
            sentence = generateRawSentence();
            safeCounter++;
            if (safeCounter > 200) {
                console.warn("Too many rerolls, resetting memory.");
                bannedSentences.clear();
                localStorage.removeItem('speedrunBannedSet');
                updateStats();
                break;
            }
        } while (bannedSentences.has(sentence.de));
        
        return sentence;
    }

    // ==========================================
    // UI CONTROLS
    // ==========================================
    const promptEl = document.getElementById("english-prompt");
    const answerEl = document.getElementById("german-answer");
    const btnNext = document.getElementById("btn-next");
    const btnDanger = document.getElementById("btn-danger");

    function loadQuestion() {
        currentSentenceData = getUniqueSentence();
        promptEl.innerHTML = currentSentenceData.en;
        answerEl.innerText = currentSentenceData.de;
        
        answerEl.classList.remove("visible");
        btnNext.classList.remove("active");
        btnDanger.classList.remove("active");
        updateStats();
    }

    function showAnswer() {
        answerEl.classList.add("visible");
        btnNext.classList.add("active");
        btnDanger.classList.add("active"); 
    }

    function nextQuestion() {
        loadQuestion();
    }

    function banSentence() {
        bannedSentences.add(currentSentenceData.de);
        localStorage.setItem('speedrunBannedSet', JSON.stringify([...bannedSentences]));
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
