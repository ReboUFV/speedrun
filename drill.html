<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill · Speedrun OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/app.js"></script>
    <style>
        .drill { text-align: center; padding: 28px 20px; }
        .drill__label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
        .drill__prompt { font-size: clamp(1.15rem, 3.5vw, 1.4rem); font-weight: 650; line-height: 1.5; margin: 8px 0 22px; }
        .drill__answer {
            font-size: clamp(1.2rem, 3.6vw, 1.45rem); font-weight: 700; line-height: 1.5; color: var(--accent-strong);
            background: var(--accent-soft); border-radius: var(--radius-sm); padding: 14px; margin: 8px 0 22px; min-height: 84px;
            display: flex; align-items: center; justify-content: center;
        }
        .drill__answer.is-hidden { background: transparent; border: 2px dashed var(--border); color: var(--text-3); font-weight: 500; font-size: 0.95rem; }
        .drill__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .drill__actions .btn--danger { grid-column: 1 / -1; }
        .shortcuts { margin-top: 14px; font-size: 0.82rem; color: var(--text-3); display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

<main class="page page--narrow" id="main">
    <div class="page-head">
        <span class="eyebrow">Word order</span>
        <h1>Mental Drill</h1>
        <p class="lede">Translate the English sentence in your head (or out loud), then reveal the German. Mark sentences you've mastered so they never come back.</p>
    </div>

    <section class="card drill" aria-live="polite">
        <div class="drill__label">English</div>
        <div class="drill__prompt" id="english-prompt">Loading…</div>
        <div class="drill__label">German</div>
        <div class="drill__answer is-hidden" id="german-answer" lang="de">Say it first, then reveal</div>

        <div class="drill__actions">
            <button class="btn btn--primary" type="button" id="btn-answer">Show answer</button>
            <button class="btn" type="button" id="btn-next" disabled>Next</button>
            <button class="btn btn--danger" type="button" id="btn-danger" disabled>Mastered · never repeat</button>
        </div>
        <div class="shortcuts" aria-hidden="true">
            <span><span class="kbd">Space</span> show</span>
            <span><span class="kbd">Enter</span> / <span class="kbd">→</span> next</span>
            <span><span class="kbd">M</span> mastered</span>
        </div>
    </section>

    <div class="stats" style="margin-top:16px; grid-template-columns: 1fr 1fr;">
        <div class="stat"><div class="stat__value" id="stats">0</div><div class="stat__label">Mastered sentences</div></div>
        <div class="stat"><div class="stat__value" id="session">0</div><div class="stat__label">Seen this session</div></div>
    </div>

    <div style="margin-top:16px">
        <button class="btn btn--sm" type="button" id="btn-reset">Reset mastered list</button>
    </div>
</main>

<script>
    var bannedSentences;
    try { bannedSentences = new Set(JSON.parse(localStorage.getItem('speedrunBannedSet')) || []); } catch (e) { bannedSentences = new Set(); }
    var currentSentenceData = { en: "", de: "" };
    var seen = 0, revealed = false;

    function persist() {
        try { localStorage.setItem('speedrunBannedSet', JSON.stringify(Array.from(bannedSentences))); } catch (e) {}
    }
    function updateStats() {
        document.getElementById('stats').textContent = bannedSentences.size;
        document.getElementById('session').textContent = seen;
    }

    const subjects = [
        { de: "ich", en: "I", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"want to"} } },
        { de: "wir", en: "we", m: { can: {de:"können", en:"can"}, must: {de:"müssen", en:"must"}, want: {de:"wollen", en:"want to"} } },
        { de: "er", en: "he", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"wants to"} } },
        { de: "sie", en: "she", m: { can: {de:"kann", en:"can"}, must: {de:"muss", en:"must"}, want: {de:"will", en:"wants to"} } }
    ];

    const actions = [
        { oDe: "das Buch", oEn: "the book", vDe: "lesen", vEn: "read" },
        { oDe: "die Pizza", oEn: "the pizza", vDe: "essen", vEn: "eat" },
        { oDe: "Deutsch", oEn: "German", vDe: "lernen", vEn: "study" },
        { oDe: "das Auto", oEn: "the car", vDe: "kaufen", vEn: "buy" },
        { oDe: "das Projekt", oEn: "the project", vDe: "machen", vEn: "do" }
    ];

    const temporals = [
        { de: "heute", en: "today" }, { de: "morgen", en: "tomorrow" }, { de: "jetzt", en: "now" }
    ];

    const modals = [
        { de: "schnell", en: "quickly" }, { de: "leider", en: "unfortunately" }, { de: "gerne", en: "gladly" }
    ];

    const lokals = [
        { de: "zu Hause", en: "at home" }, { de: "in der Schule", en: "at school" }, { de: "draußen", en: "outside" }
    ];

    const pos0Connectors = [
        { de: "und", en: "and" }, { de: "aber", en: "but" }, { de: "denn", en: "because" }
    ];

    const verbKickers = [
        { de: "weil", en: "because" }, { de: "wenn", en: "if" }
    ];

    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function buildClause() {
        const s = getRandom(subjects);
        const modalKey = getRandom(["can", "must", "want"]);
        const m = s.m[modalKey];
        const a = getRandom(actions);
        const t = getRandom(temporals);
        const mod = getRandom(modals);
        const l = getRandom(lokals);

        let deMittelfeld = `${t.de} ${mod.de} ${a.oDe} ${l.de}`;
        let de = `${s.de} ${m.de} ${deMittelfeld} ${a.vDe}`;
        let en = `${s.en} ${m.en} ${a.vEn} ${a.oEn} ${mod.en} ${l.en} ${t.en}`;
        
        return { de, en };
    }

    function buildNebensatz(connector) {
        const s = getRandom(subjects);
        const modalKey = getRandom(["can", "must", "want"]);
        const m = s.m[modalKey];
        const a = getRandom(actions);
        const t = getRandom(temporals);
        const mod = getRandom(modals);
        const l = getRandom(lokals);

        let de = `${connector.de} ${s.de} ${t.de} ${mod.de} ${a.oDe} ${l.de} ${a.vDe} ${m.de}`;
        let en = `${connector.en} ${s.en} ${m.en} ${a.vEn} ${a.oEn} ${mod.en} ${l.en} ${t.en}`;

        return { de, en };
    }

    function generateRawSentence() {
        const pattern = Math.floor(Math.random() * 3);
        let finalDe = "";
        let finalEn = "";

        if (pattern === 0) {
            let c1 = buildClause();
            let conn = getRandom(pos0Connectors);
            let c2 = buildClause();
            finalEn = `${capitalize(c1.en)}, ${conn.en} ${c2.en}.`;
            finalDe = `${capitalize(c1.de)}, ${conn.de} ${c2.de}.`;
        } else if (pattern === 1) {
            let c1 = buildClause();
            let conn = getRandom(verbKickers);
            let c2 = buildNebensatz(conn);
            finalEn = `${capitalize(c1.en)}, ${c2.en}.`;
            finalDe = `${capitalize(c1.de)}, ${c2.de}.`;
        } else {
            const intros = [
                { de: "ich denke", en: "I think" }, { de: "er sagt", en: "he says" }, { de: "wir wissen", en: "we know" }
            ];
            let intro = getRandom(intros);
            let c2 = buildNebensatz({de: "dass", en: "that"});
            finalEn = `${capitalize(intro.en)}, ${c2.en}.`;
            finalDe = `${capitalize(intro.de)}, ${c2.de}.`;
        }
        return { en: finalEn, de: finalDe };
    }

    function getUniqueSentence() {
        let sentence;
        let safeCounter = 0;
        
        do {
            sentence = generateRawSentence();
            safeCounter++;
            if (safeCounter > 200) {
                console.warn("Too many rerolls, resetting memory.");
                bannedSentences.clear();
                persist();
                updateStats();
                break;
            }
        } while (bannedSentences.has(sentence.de));
        
        return sentence;
    }

    var promptEl = document.getElementById("english-prompt");
    var answerEl = document.getElementById("german-answer");
    var btnAnswer = document.getElementById("btn-answer");
    var btnNext = document.getElementById("btn-next");
    var btnDanger = document.getElementById("btn-danger");

    function loadQuestion() {
        currentSentenceData = getUniqueSentence();
        promptEl.textContent = currentSentenceData.en;
        answerEl.textContent = "Say it first, then reveal";
        answerEl.classList.add("is-hidden");
        revealed = false;
        btnNext.disabled = true;
        btnDanger.disabled = true;
        btnAnswer.disabled = false;
        seen++;
        updateStats();
    }
    function showAnswer() {
        answerEl.textContent = currentSentenceData.de;
        answerEl.classList.remove("is-hidden");
        revealed = true;
        btnNext.disabled = false;
        btnDanger.disabled = false;
        btnAnswer.disabled = true;
        btnNext.focus();
    }
    function banSentence() {
        bannedSentences.add(currentSentenceData.de);
        persist();
        toast("Marked as mastered");
        loadQuestion();
    }

    btnAnswer.addEventListener("click", showAnswer);
    btnNext.addEventListener("click", loadQuestion);
    btnDanger.addEventListener("click", banSentence);
    document.getElementById("btn-reset").addEventListener("click", function () {
        if (!confirm("Bring back all " + bannedSentences.size + " mastered sentences?")) return;
        bannedSentences.clear(); persist(); updateStats(); toast("Mastered list cleared");
    });

    document.addEventListener("keydown", function (e) {
        if (e.target.closest("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === " " && !revealed) { e.preventDefault(); showAnswer(); }
        else if ((e.key === "Enter" || e.key === "ArrowRight") && revealed && e.target.tagName !== "BUTTON") { e.preventDefault(); loadQuestion(); }
        else if ((e.key === "m" || e.key === "M") && revealed) { e.preventDefault(); banSentence(); }
    });

    loadQuestion();
</script>

</body>
</html>
